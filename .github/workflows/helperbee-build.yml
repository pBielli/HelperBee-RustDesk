name: HelperBee - RustDesk build

# 1) Run on master: applies helperbee/apply-branding.py (name, logo, accent, HelperBee panel) and pushes the
#    result to the "helperbee" branch.
# 2) Run on the "helperbee" branch: builds RustDesk from it (the upstream build workflow); the Windows
#    installer is published in release "helperbee". AGPL-3.0: this fork keeps the full source public.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  brand:
    if: github.ref_name != 'helperbee'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Apply HelperBee branding
        run: |
          python3 -c "import PIL" 2>/dev/null || pip install --quiet pillow
          HB_PANEL=helperbee/helperbee_panel.dart python3 helperbee/apply-branding.py .
      - name: Commit to branch helperbee
        run: |
          git config user.name "pBielli"
          git config user.email "pBielli@users.noreply.github.com"
          git checkout -B helperbee
          git add -A
          git commit -m "HelperBee branding (name, logo, accent, HelperBee panel)"
          git push -f origin helperbee
          echo "Branding committed. Now run this workflow again on the helperbee branch to build." >> $GITHUB_STEP_SUMMARY

  build:
    if: github.ref_name == 'helperbee'
    uses: ./.github/workflows/flutter-build.yml
    secrets: inherit
    with:
      upload-artifact: true
      upload-tag: "helperbee"
